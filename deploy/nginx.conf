# Reverse proxy for the Smart Hiring Platform: routes /api/* (and the interview
# WebSocket) to the FastAPI backend, everything else to the Next.js frontend.
#
# This is a starting point for a real deployment, not tested against a live ECS/EC2
# target in this environment (no such infrastructure exists here) — see
# MODULE_8_SETUP.md for what was and wasn't verified.

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

# Rate limiting for the auth endpoints specifically — login/register are the most
# common brute-force / credential-stuffing target on any API.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;  # matches the backend's resume upload limit

    # --- Backend API ---
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy_params_common.conf;
    }

    location /api/ {
        proxy_pass http://backend;
        include /etc/nginx/proxy_params_common.conf;
    }

    # WebSocket upgrade for the real-time voice interview stream (Module 5).
    location /api/v1/ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        include /etc/nginx/proxy_params_common.conf;
    }

    location /metrics {
        # Prometheus scrape endpoint — restrict to the monitoring network, not the
        # public internet, in a real deployment.
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://backend;
        include /etc/nginx/proxy_params_common.conf;
    }

    # --- Frontend (Next.js) ---
    location / {
        proxy_pass http://frontend;
        include /etc/nginx/proxy_params_common.conf;
    }
}
